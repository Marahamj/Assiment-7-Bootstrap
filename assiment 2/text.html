<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title> Assignment 2</title>

</head>

<body>


    <div class="container">

        <h1>User Registration Form</h1>

        <form action="#" method="post" enctype="multipart/form-data">

            <!-- Full Name -->
            <label for="fullname">Full Name</label>
            <input type="text" id="fullname" name="fullname" placeholder="Enter your full name" required minlength="3">

            <!-- Email -->
            <label for="email">Email Address</label>
            <input type="email" id="email" name="email" placeholder="Enter your email" required>

            <!-- Password -->
            <label for="password">Password</label>
            <input type="password" id="password" name="password" placeholder="Enter your password" required
                minlength="8">

            <!-- Date -->
            <label for="birthdate">Date of Birth</label>
            <input type="date" id="birthdate" name="birthdate" required>

            <!-- Select Dropdown -->
            <label for="country">Country</label>
            <select id="country" name="country" required>
                <option value="">Select Country</option>
                <option value="Palestine">Palestine</option>
                <option value="Jordan">Jordan</option>
                <option value="Egypt">Egypt</option>
                <option value="Saudi Arabia">Saudi Arabia</option>
            </select>

            <!-- Radio Buttons -->
            <label>Gender</label>

            <div class="radio-group">
                <input type="radio" id="male" name="gender" value="Male" required>
                <label for="male">Male</label>

                <input type="radio" id="female" name="gender" value="Female">
                <label for="female">Female</label>
            </div>

            <!-- Checkboxes -->
            <label>Interests</label>

            <div class="checkbox-group">
                <div> <input type="checkbox" id="coding" name="interests" value="Coding">
                    <label for="coding">Coding</label>
                </div>
                <div><input type="checkbox" id="sports" name="interests" value="Sports">
                    <label for="sports">Sports</label>
                </div>


                <div>
                    <input type="checkbox" id="design" name="interests" value="Design">
                    <label for="design">Design</label>
                </div>
            </div>

            <!-- Range Slider -->
            <div>
                <label for="experience">
                    Experience Level (0 - 10)
                </label>

                <input type="range" id="experience" name="experience" min="0" max="10">
            </div>

            <!-- File Upload -->
            <div>
                <label for="photo">Upload Profile Picture</label>

                <input type="file" id="photo" name="photo" accept="image/*">
            </div>

            <!-- Textarea -->
            <div>
                <label for="about">About You</label>

                <textarea id="about" name="about" rows="5" placeholder="Write something about yourself..."
                    required></textarea>

            </div>


            <!-- Submit Button -->
            <button type="submit">
                Register
            </button>

        </form>

    </div>

</body>

</html>
